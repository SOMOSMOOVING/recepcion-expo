/* ==========================================================================
   2 · CARTEL DE LA ENTRADA  (#cartel=CLAVE → #buscar, #alta)
   La clave del QR impreso queda en el celular: sin ella la base no deja
   buscar ni dar de alta.
   ========================================================================== */
const CLAVE_CARTEL = "expoCartel";
const claveCartel = () => leerClave(CLAVE_CARTEL);
let ultimaBusqueda = "";

const datosCartel = () => ["Registro", capital(diaLargo(hoyAR()))];

/* sin tildes, sin mayúsculas, carácter por carácter (mismo largo que el
   original, para poder resaltar en el texto de verdad) */
const sinTilde = c => c.normalize("NFD").charAt(0).toLowerCase();
const normalizar = t => Array.from(String(t), sinTilde).join("").replace(/\./g, "").replace(/[^a-z0-9ñ]+/g, " ").trim();
const alcanzaParaBuscar = t => normalizar(t).replace(/ /g, "").length >= MIN_LETRAS_BUSQUEDA;

/* Marca en la razón social cada palabra buscada (todo escapado). */
function resaltar(texto, q) {
  const base = Array.from(texto, sinTilde);
  const marca = base.map(() => false);
  for (const p of normalizar(q).split(" ").filter(Boolean)) {
    const i = base.join("").indexOf(p);
    if (i >= 0) for (let k = i; k < i + p.length; k++) marca[k] = true;
  }
  let html = "", dentro = false;
  Array.from(texto).forEach((c, k) => {
    if (marca[k] !== dentro) { html += marca[k] ? '<mark class="mr-encontrado">' : "</mark>"; dentro = marca[k]; }
    html += escH(c);
  });
  return html + (dentro ? "</mark>" : "");
}

function pantallaSinClaveCartel() {
  return pintar(pantalla({
    datos: ["Registro"],
    arriba: false,
    cuerpo: estado({
      icono: ICONO.lupa, titulo: "Escaneá el QR del cartel de la entrada", grande: false,
      textos: `<p class="mr-chico">Para buscar tu empresa, apuntá la cámara del celular al QR del cartel.</p>`,
    }),
  }));
}

let busquedaN = 0, demora = null;

function pantallaBuscar() {
  if (!claveCartel()) return pantallaSinClaveCartel();
  if (altaPendiente()) return esperarAlta(altaPendiente());
  const vista = pintar(pantalla({
    datos: datosCartel(),
    arriba: false,
    cuerpo: `<h1 class="mr-titulo">Buscá tu empresa</h1>`
      + `<label class="mr-buscador">${ICONO.lupa}<span class="mr-oculto">Buscá tu empresa</span>`
      + `<input class="mr-entrada" type="search" id="q" placeholder="Ej.: Papeltec" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="80">`
      + `<button class="mr-buscador-limpiar" type="button" aria-label="Borrar" id="limpiar" hidden>×</button></label>`
      + `<div id="resultados" style="display:contents"></div>`,
    extra: `<div id="barra" style="display:contents"></div>`,   // la barra de abajo cambia según el resultado
  }));
  const q = $("#q");
  q.value = ultimaBusqueda;
  q.addEventListener("input", () => { clearTimeout(demora); demora = setTimeout(buscar, DEMORA_BUSQUEDA_MS); });
  $("#limpiar").onclick = () => { q.value = ""; buscar(); q.focus(); };
  buscar();
  q.focus();   // "Abre con el teclado listo"
  return vista;
}

function mostrarResultados(cuerpo, barra = "") {
  $("#resultados").innerHTML = cuerpo;
  $("#barra").innerHTML = barra ? `<div class="mr-barra">${barra}</div>` : "";
}
const noAparecés = `<div style="text-align:center;border-top:1px solid var(--linea);padding-top:var(--esp-4)"><p class="mr-chico">¿No aparecés?</p>`
  + `<a class="mr-boton mr-boton--secundario mr-boton--ancho" href="#alta" style="margin-top:var(--esp-2)">Registrarme sin estar en la lista</a></div>`;

async function buscar() {
  const q = $("#q");
  if (!q) return;
  const texto = q.value;
  ultimaBusqueda = texto;
  $("#limpiar").hidden = !texto;
  const n = ++busquedaN;
  if (!alcanzaParaBuscar(texto)) {
    return mostrarResultados(`<p class="mr-chico">Escribí al menos ${MIN_LETRAS_BUSQUEDA} letras: la razón social, el nombre del local o tu código de cliente. No importan tildes ni mayúsculas.</p>` + noAparecés);
  }
  let filas;
  try {
    filas = await rpc("expo_buscar", { p_clave: claveCartel(), p_texto: texto });
  } catch (e) {
    if (n !== busquedaN) return;
    if (e instanceof ErrorServidor && e.message === "expo_clave_cartel_invalida") {
      borrarLocal(CLAVE_CARTEL);
      return pantallaSinClaveCartel();
    }
    mostrarResultados(
      aviso({ tipo: "error", titulo: "No pudimos buscar", texto: "Revisá la señal o conectate al wifi de la expo.", textoChico: true }),
      `<button class="mr-boton mr-boton--principal" type="button" id="denuevo">Probar de nuevo</button>`);
    $("#denuevo").onclick = buscar;
    return;
  }
  if (n !== busquedaN) return;   // llegó tarde: ya se escribió otra cosa
  filas = (filas || []).filter(f => TOKEN_RE.test(f.token || ""));
  if (!filas.length) {
    return mostrarResultados(
      estado({
        icono: ICONO.lupa, titulo: `No encontramos “${escH(texto.trim())}”`, grande: false, estilo: "padding:var(--esp-6) 0",
        textos: `<p class="mr-chico">Probá con una sola palabra, o con el nombre que figura en la factura.</p>`,
      }),
      `<a class="mr-boton mr-boton--principal" href="#alta">Registrarme igual</a>`);
  }
  mostrarResultados(
    `<ul class="mr-lista">${filas.map(f => `<li><button class="mr-resultado" type="button" data-token="${f.token}"><span class="mr-resultado-texto">`
      + `<span class="mr-resultado-razon">${resaltar(f.razon_social || "", texto)}</span>`
      + `<span class="mr-chico" style="display:block">${[escH(f.localidad || ""), f.codigo_erp ? `Cód. <span class="mr-num">${escH(f.codigo_erp)}</span>` : ""].filter(Boolean).join(" · ")}</span>`
      + `</span><span class="mr-resultado-flecha">${ICONO.flecha}</span></button></li>`).join("")}</ul>`
    + `<p class="mr-chico" style="text-align:center">${filas.length === 1 ? "1 resultado" : filas.length + " resultados"}</p>`
    + noAparecés);
  // tocar un resultado abre la pantalla 1 de ese cliente
  document.querySelectorAll(".mr-resultado[data-token]").forEach(b => {
    b.onclick = () => { location.hash = "t=" + b.dataset.token; };
  });
}

/* Alta rápida: acá se separa el 12 % que no es cliente. */
const CATEGORIAS = [
  ["cliente", "Soy cliente de Mooving"],
  ["cliente_de_cliente", "Vengo con un cliente"],
  ["proveedor", "Soy proveedor"],
  ["comex", "Comex (despachante, forwarder)"],
  ["licencia", "Agente de licencias"],
];

function pantallaAlta() {
  if (!claveCartel()) return pantallaSinClaveCartel();
  if (altaPendiente()) return esperarAlta(altaPendiente());
  const empresa = alcanzaParaBuscar(ultimaBusqueda) ? ultimaBusqueda.trim() : "";
  const vista = pintar(pantalla({
    datos: ["Registrarme"],
    accion: `<a class="mr-boton mr-boton--texto" href="#buscar" style="min-height:32px">Volver</a>`,
    arriba: false,
    cuerpo: `<div id="faltan" style="display:contents"></div>`
      + `<label class="mr-campo"><span>Tu nombre</span><input class="mr-entrada" id="nombre" autocomplete="name" maxlength="80"></label>`
      + `<label class="mr-campo"><span>Empresa o comercio</span><input class="mr-entrada" id="empresa" autocomplete="organization" maxlength="120" value="${escH(empresa)}"></label>`
      + `<fieldset class="mr-contador"><legend class="mr-contador-pregunta" style="font-size:14px;line-height:20px;margin-bottom:6px">¿Cómo venís a la expo?</legend><div class="mr-opciones-categoria">`
      + CATEGORIAS.map(([v, t], i) => `<label><input type="radio" name="cat" value="${v}"${i === 0 ? " checked" : ""}>${t}</label>`).join("")
      + `</div></fieldset>`
      + `<label class="mr-campo"><span>CUIT o código de cliente <small>(si lo tenés a mano)</small></span><input class="mr-entrada" id="cuit" inputmode="numeric" placeholder="Opcional" maxlength="20"></label>`
      + contador(PERSONAS_POR_DEFECTO, "¿Cuántos vienen?"),
    barra: `<button class="mr-boton mr-boton--principal" type="button" id="principal">Registrarme · ${cuantos(PERSONAS_POR_DEFECTO)}</button>`,
  }));
  const boton = $("#principal");
  const cantidad = conectarContador(PERSONAS_POR_DEFECTO, boton, "Registrarme");
  boton.onclick = () => darDeAlta(cantidad(), boton);
  return vista;
}

async function darDeAlta(n, boton) {
  if (boton.disabled) return;
  const campo = id => $("#" + id).value.replace(/\s+/g, " ").trim();
  const nombre = campo("nombre"), empresa = campo("empresa"), cuit = campo("cuit");
  const faltaNombre = nombre.length < MIN_LARGO_NOMBRE, faltaEmpresa = empresa.length < MIN_LARGO_NOMBRE;
  $("#nombre").setAttribute("aria-invalid", String(faltaNombre));
  $("#empresa").setAttribute("aria-invalid", String(faltaEmpresa));
  const faltan = [];
  if (faltaNombre) faltan.push("tu nombre");
  if (faltaEmpresa) faltan.push("la empresa o el comercio");
  if (faltan.length) {
    $("#faltan").innerHTML = avisoFino({ tipo: "error", icono: ICONO.atencion, rol: "alert", texto: `Falta ${faltan.join(" y ")}.` });
    return $(faltaNombre ? "#nombre" : "#empresa").focus();
  }
  const categoria = (document.querySelector('input[name="cat"]:checked') || {}).value || "cliente";
  const args = {   // sin la clave del cartel: se pone al enviar (conClaves)
    p_nombre: nombre, p_empresa: empresa, p_categoria: categoria,
    p_cuit: cuit || null, p_cantidad: n, p_clave: crypto.randomUUID(),   // la clave hace que un reintento no duplique
  };
  ocupar(boton, "Registrando…");
  const vista = vistaN;
  // queda guardada ANTES de mandarla: si se recarga a mitad, el reintento usa
  // la misma clave y la base no la duplica
  const id = encolar("expo_alta_rapida", args);
  ultimaBusqueda = "";
  alSalir(id, vista, (r, error) => {
    if (!error) return pantallaAltaLista(r.razon_social || empresa, r.llegada, r.cantidad);
    liberar(boton, "Registrarme · " + cuantos(n));
    $("#faltan").innerHTML = avisoFino({ tipo: "error", icono: ICONO.atencion, rol: "alert", texto: escH(mensajeDe(error)) });
  });
  try {
    salio(id, await rpc("expo_alta_rapida", conClaves({ fn: "expo_alta_rapida", args })));
  } catch (e) {
    if (!(e instanceof ErrorRed)) return salio(id, undefined, e);
    // sin señal: sigue en la cola; si la cola no la mandó ya, se espera
    const item = leerCola().find(i => i.id === id);
    if (item && vistaN === vista) esperarAlta(item);
  }
}

/* "No hay señal, pero ya pueden pasar": el alta espera en la cola. También
   al volver al cartel o al recargar, así nadie la carga dos veces. */
const altaPendiente = () => leerCola().find(i => i.fn === "expo_alta_rapida");
function esperarAlta(item) {
  const { p_empresa: empresa, p_cantidad: n } = item.args;
  const vista = pintar(pantalla({
    datos: datosCartel(),
    arriba: false,
    cuerpo: sinSenalPasen(`<b>${escH(empresa)}</b><br>${escH(hora(item.creado))} · ${escH(personas(n))}`),
    barra: reintentando(),
  }));
  alSalir(item.id, vista, (r, error) => error ? pantallaError(error) : pantallaAltaLista(r.razon_social || empresa, r.llegada, r.cantidad));
  procesarCola();
  return vista;
}

/* Alta lista: mismo cierre que el check-in. */
function pantallaAltaLista(empresa, llegada, n) {
  return pintar(pantalla({
    datos: datosCartel(),
    arriba: false,
    cuerpo: bienvenidos(`<b>${escH(empresa)}</b><br>${escH(hora(llegada))} · ${escH(personas(n))}`),
  }));
}

/* ==========================================================================
   3 · EQUIPO DE RECORRIDO  (#equipo=CLAVE → #recorrido)
   El link del equipo lleva una clave (decidido el 06/10: opción A). La clave
   y quién es cada uno quedan en el celular: "Sin usuario ni clave".
   Lo normal es "Lo atiende su vendedor" (nada cargado); "Me anoto" registra
   la excepción. Nunca se carga el vendedor como recorrido: solo se manda el
   id de la persona del equipo que eligió "¿Quién sos?".
   ========================================================================== */
const CLAVE_EQUIPO = "expoEquipo";
const YO = "expoYo";                        // { id, nombre, rol } de "¿Quién sos?"
const PRESENTES_GUARDADOS = "expoPresentes";
const LISTA_EQUIPO = "expoEquipoLista";
const ACCIONES_EQUIPO = ["expo_anotarme", "expo_bajarme", "expo_tome_pedido"];
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

const claveEquipo = () => leerClave(CLAVE_EQUIPO);
const yo = () => { const y = leerLocal(YO); return y && UUID_RE.test(y.id || "") ? y : null; };
const fmtDiaCorto = new Intl.DateTimeFormat("es-AR", { weekday: "short", timeZone: "UTC" });
const diaCorto = iso => capital(fmtDiaCorto.format(fechaDe(iso)).replace(".", "")) + " " + fechaDe(iso).getUTCDate();   // "Mié 15"
const ROLES = { hostess: "Hostess", marketing: "Marketing" };
const CATEGORIA_INSIGNIA = {
  comex: ["comex", "Comex"],
  proveedor: ["proveedor", "Proveedor"],
  licencia: ["licencia", "Agente de licencia"],
  cliente_de_cliente: ["cliente-de-cliente", "Cliente de un cliente"],
};

/* "Sofía Giménez" → "Sofía G." (como en el diseño) */
function corto(nombre) {
  const p = String(nombre || "").trim().split(/\s+/);
  return p.length > 1 ? `${p[0]} ${p[p.length - 1].charAt(0).toUpperCase()}.` : p[0];
}
/* "Ana L. y Camila R." / "Ana L., Camila R. y vos" */
function enumerar(nombres) {
  return nombres.length < 2 ? nombres.join("") : nombres.slice(0, -1).join(", ") + " y " + nombres[nombres.length - 1];
}
/* "MINUCHIN MARTA LILIANA - LIBRERIA PAPELTEC" → "Libreria Papeltec": el nombre
   del local, con mayúscula inicial, para la tostada. Las tildes que no están
   en Finnegans no se pueden adivinar. */
function nombreDelLocal(rs) {
  const partes = partirRazon(String(rs || ""));
  return partes[partes.length - 1].toLowerCase().replace(/(^|\s)(\S)/g, (_, a, b) => a + b.toUpperCase());
}

/* La pantalla del equipo que está abierta:
   { clave, yo, vista, datos (expo_presentes), vistoEn, sinRed, aviso, filtro, q, tostada } */
let eq = null;

function pantallaEquipoSinClave() {
  return pintar(pantalla({
    datos: ["Recorridos"],
    arriba: false,
    cuerpo: estado({
      tipo: "error", icono: ICONO.invalido, titulo: "Este link del equipo ya no sirve", grande: false,
      textos: `<p class="mr-chico">Pedile a recepción el link nuevo del equipo de recorrido.</p>`,
    }),
  }));
}
function claveEquipoVencida() {
  borrarLocal(CLAVE_EQUIPO);
  return pantallaEquipoSinClave();
}

/* Lo que todavía no salió (en la cola) ya se ve aplicado en la lista. */
function aplicarAccion(datos, { fn, args }, nombre) {
  const p = (datos.presentes || []).find(x => x.visita_id === args.p_visita);
  if (!p) return;
  const estoy = p.recorrido.some(r => r.id === args.p_equipo);
  if (fn === "expo_anotarme" && !estoy) p.recorrido = p.recorrido.concat({ id: args.p_equipo, nombre, tomo_pedido: false });
  if (fn === "expo_bajarme") p.recorrido = p.recorrido.filter(r => r.id !== args.p_equipo);
  if (fn === "expo_tome_pedido") p.recorrido = p.recorrido.map(r => r.id === args.p_equipo ? { ...r, tomo_pedido: args.p_tomo } : r);
}
const accionesPendientes = idEquipo => leerCola().filter(i => ACCIONES_EQUIPO.includes(i.fn) && i.args.p_equipo === idEquipo);

/* "¿Quién sos?": se elige una vez y queda en el celular. Si ya había alguien
   elegido, "Volver" deja todo como estaba. */
async function pantallaQuienSos() {
  const clave = claveEquipo();
  if (!clave) return pantallaEquipoSinClave();
  const vista = pintar(pantalla({
    datos: ["Recorridos · " + diaCorto(hoyAR())],
    accion: yo() ? `<button class="mr-boton mr-boton--texto" type="button" id="volverRecorrido" style="min-height:32px">Volver</button>` : "",
    arriba: false,
    hueco: "var(--esp-4)",
    cuerpo: `<div><h1 class="mr-titulo">¿Quién sos?</h1>`
      + `<p class="mr-chico" style="margin-top:4px">Se elige una vez y queda guardado en este celular. Sin usuario ni clave.</p></div>`
      + `<div class="mr-buscador">${ICONO.lupa}<input class="mr-entrada" type="search" id="quien" aria-label="Buscá tu nombre" autocomplete="off" style="font-size:18px"></div>`
      + `<div id="listaEquipo" style="display:contents"></div>`
      + `<p class="mr-chico">¿No estás? Pedile a recepción que te agregue.</p>`,
  }));
  let lista = leerLocal(LISTA_EQUIPO) || [];
  const pintarLista = () => {
    const q = normalizar($("#quien").value);
    const quienes = lista.filter(p => !q || normalizar(p.nombre).includes(q));
    $("#listaEquipo").innerHTML = quienes.length ? `<ul class="mr-lista">${quienes.map(p =>
      `<li><button class="mr-resultado" type="button" data-id="${escH(p.id)}" style="min-height:56px"><span class="mr-resultado-texto">`
      + `<span class="mr-resultado-razon">${escH(p.nombre)}</span><span class="mr-chico" style="display:block">${escH(ROLES[p.rol] || "")}</span>`
      + `</span><span class="mr-resultado-flecha">${ICONO.flecha}</span></button></li>`).join("")}</ul>` : "";
    document.querySelectorAll("#listaEquipo [data-id]").forEach(b => {
      b.onclick = () => {
        const p = lista.find(x => x.id === b.dataset.id);
        guardarLocal(YO, { id: p.id, nombre: p.nombre, rol: p.rol });
        pantallaRecorrido();
      };
    });
  };
  if ($("#volverRecorrido")) $("#volverRecorrido").onclick = () => pantallaRecorrido();
  $("#quien").addEventListener("input", pintarLista);
  pintarLista();
  $("#quien").focus();
  try {
    lista = await rpc("expo_equipo_lista", { p_clave: clave }) || [];
    guardarLocal(LISTA_EQUIPO, lista);
  } catch (e) {
    if (vistaN !== vista) return;
    if (e instanceof ErrorServidor && e.message === "expo_clave_invalida") return claveEquipoVencida();
    // sin señal: queda la lista que se vio la última vez (si hubo)
  }
  if (vistaN === vista) pintarLista();
}

/* Presentes del día: cabecera, buscador y una lista que se repinta sola. */
function pantallaRecorrido() {
  const clave = claveEquipo(), quien = yo();
  if (!clave) return pantallaEquipoSinClave();
  if (!quien) return pantallaQuienSos();
  // lo guardado sirve solo si es de hoy y de esta persona: la lista de ayer no se usa
  const guardados = leerLocal(PRESENTES_GUARDADOS);
  const sirve = guardados && guardados.equipo === quien.id && guardados.datos && guardados.datos.hoy === hoyAR();
  const vista = pintar(pantalla({
    datos: ["Recorridos · " + diaCorto(hoyAR())],
    accion: `<button class="mr-boton mr-boton--texto" type="button" id="quiensoy" style="min-height:32px" aria-label="Cambiar de persona (ahora: ${escH(quien.nombre)})">${escH(corto(quien.nombre))} ▾</button>`,
    arriba: false,
    hueco: "var(--esp-3)",
    cuerpo: `<div id="sinred" style="display:contents"></div>`
      + `<div class="mr-buscador" style="margin-bottom:2px">${ICONO.lupa}<input class="mr-entrada" type="search" id="buscarPresente" placeholder="Buscar presente" aria-label="Buscar presente" autocomplete="off" style="min-height:48px;font-size:16px"></div>`
      + `<div id="presentes" style="display:contents"></div>`
      + `<div id="tostada" style="display:contents"></div>`,
  }));
  eq = {
    clave, yo: quien, vista, filtro: "todos", q: "", tostada: null, aviso: "", sinRed: false,
    datos: sirve ? guardados.datos : null, vistoEn: sirve ? guardados.vistoEn : null,
  };
  $("#quiensoy").onclick = () => pantallaQuienSos();
  $("#buscarPresente").addEventListener("input", e => { eq.q = e.target.value; repintarPresentes(); });
  // los toques de la lista se atienden acá una sola vez (la lista se repinta seguido)
  $("#presentes").addEventListener("click", tocarEnLaLista);
  $("#presentes").addEventListener("change", tocarEnLaLista);
  avisarSinRed = () => { if (eq && vistaN === eq.vista) { eq.sinRed = true; repintarPresentes(); } };
  repintarPresentes();
  cargarPresentes(vista);
  const reloj = setInterval(() => (vistaN === vista ? cargarPresentes(vista) : clearInterval(reloj)), REFRESCO_PRESENTES_MS);
  return vista;
}

function tocarEnLaLista(e) {
  const t = e.target;
  if (e.type === "change" && t.dataset.pedido) return accionEquipo("expo_tome_pedido", t.dataset.pedido, t.checked);
  if (e.type !== "click") return;
  const b = t.closest("button");
  if (!b) return;
  if (b.dataset.filtro) { eq.filtro = b.dataset.filtro; return repintarPresentes(); }
  if (b.dataset.anotar) return accionEquipo("expo_anotarme", b.dataset.anotar);
  if (b.dataset.bajar) return accionEquipo("expo_bajarme", b.dataset.bajar);
}

async function cargarPresentes(vista) {
  try {
    const datos = await rpc("expo_presentes", { p_clave: eq.clave, p_equipo: eq.yo.id });
    if (vistaN !== vista) return;
    eq.datos = datos;
    eq.vistoEn = Date.now();
    eq.sinRed = false;
    guardarLocal(PRESENTES_GUARDADOS, { equipo: eq.yo.id, datos, vistoEn: eq.vistoEn });
  } catch (e) {
    if (vistaN !== vista) return;
    if (e instanceof ErrorServidor && e.message === "expo_clave_invalida") return claveEquipoVencida();
    if (e instanceof ErrorServidor && e.message === "expo_equipo_invalido") {
      borrarLocal(YO);   // ya no está en el equipo activo: que vuelva a elegir
      return pantallaQuienSos();
    }
    eq.sinRed = true;
  }
  repintarPresentes();
}

/* Repinta los avisos, los filtros y las tarjetas (el buscador queda: no pierde
   el foco). Lo que tenía el foco lo vuelve a tener después. */
function repintarPresentes() {
  if (!eq || vistaN !== eq.vista) return;
  const avisos = (eq.aviso ? avisoFino({ tipo: "error", icono: ICONO.atencion, rol: "alert", texto: escH(eq.aviso) }) : "")
    + (eq.sinRed ? avisoFino({ tipo: "error", icono: ICONO.sinRed, texto: `<b style="display:inline">Sin conexión.</b> ${escH(antiguedad(eq.vistoEn))} Lo que anotes se envía cuando vuelva.` }) : "");
  cambiarSiHaceFalta($("#sinred"), avisos);   // si no cambió, no se vuelve a anunciar

  const datos = eq.datos ? structuredClone(eq.datos) : { presentes: [] };
  accionesPendientes(eq.yo.id).forEach(i => aplicarAccion(datos, i, eq.yo.nombre));
  const todos = (datos.presentes || []).slice().sort((a, b) => new Date(b.llegada) - new Date(a.llegada));   // los últimos arriba

  const volverAlFoco = recordarFoco();
  $("#presentes").innerHTML = todos.length ? listaDePresentes(todos) : nadieLlego(datos);
  volverAlFoco();
  cambiarSiHaceFalta($("#tostada"), eq.tostada
    ? `<div class="mr-tostada" role="status" style="position:sticky;bottom:12px">${escH(eq.tostada.texto)} <button class="mr-boton mr-boton--texto" type="button" id="deshacer">Deshacer</button></div>`
    : "");
  if (eq.tostada) $("#deshacer").onclick = () => accionEquipo("expo_bajarme", eq.tostada.visita);
}

function cambiarSiHaceFalta(caja, html) {
  if (caja.dataset.html !== html) { caja.innerHTML = html; caja.dataset.html = html; }
}

/* Qué tenía el foco (el botón o la casilla de una tarjeta, o un filtro) para
   devolvérselo cuando se repinta la lista. */
function recordarFoco() {
  const a = document.activeElement;
  if (!a || !$("#presentes").contains(a)) return () => {};
  const tarjeta = a.closest("[data-visita]");
  const selector = a.dataset.filtro ? `[data-filtro="${a.dataset.filtro}"]`
    : tarjeta ? `[data-visita="${tarjeta.dataset.visita}"] ${a.dataset.pedido ? "[data-pedido]" : ".mr-presente-pie .mr-boton"}` : null;
  return () => { const otra = selector && $("#presentes " + selector); if (otra) otra.focus({ preventScroll: true }); };
}

function nadieLlego(datos) {
  const abre = datos.estado === "en_curso" && datos.es_dia && datos.hora_apertura
    ? `Las puertas abren a las ${escH(apertura(datos.hora_apertura))}. ` : "";
  return estado({
    icono: ICONO.personas, titulo: "Todavía no llegó nadie", grande: false,
    textos: `<p class="mr-chico">${abre}La lista se actualiza sola: no hace falta recargar.</p>`,
  });
}

function listaDePresentes(todos) {
  const esMio = p => p.recorrido.some(r => r.id === eq.yo.id);
  const grupos = { todos, sin: todos.filter(p => !p.recorrido.length), mios: todos.filter(esMio) };
  const q = normalizar(eq.q);
  const visibles = grupos[eq.filtro].filter(p => !q || q.split(" ").every(w => normalizar(p.razon_social).includes(w)));
  const chip = (clave, texto) =>
    `<button class="mr-chip" type="button" data-filtro="${clave}" aria-pressed="${eq.filtro === clave}">${texto} <span class="mr-num">${grupos[clave].length}</span></button>`;
  const chips = `<div class="mr-chips" role="group" aria-label="Filtro">${chip("todos", "Todos")}${chip("sin", "Sin recorrido")}${chip("mios", "Míos")}</div>`;
  if (visibles.length) return chips + visibles.map(p => tarjeta(p, esMio(p))).join("");
  if (q) return chips + estado({ icono: ICONO.lupa, titulo: `No encontramos “${escH(eq.q.trim())}”`, grande: false });
  if (eq.filtro === "mios") {
    return chips + estado({
      icono: ICONO.personas, titulo: "Todavía no te anotaste con nadie", grande: false,
      textos: `<p class="mr-chico">Tocá “Me anoto” en un presente para que figure que le hacés el recorrido.</p>`
        + `<button class="mr-boton mr-boton--secundario" type="button" data-filtro="sin">Ver sin recorrido</button>`,
    });
  }
  return chips + estado({ icono: ICONO.ok, titulo: "Todos los presentes tienen recorrido", grande: false });
}

function antiguedad(desde) {
  if (!desde) return "No pudimos traer la lista.";
  const min = Math.floor((Date.now() - desde) / 60000);
  return min < 1 ? "La lista es de hace menos de un minuto." : min === 1 ? "La lista es de hace 1 min." : `La lista es de hace ${min} min.`;
}

/* Una tarjeta de presente (pieza FilaPresente del diseño). */
function tarjeta(p, mio) {
  const insignia = p.sin_codigo
    ? `<span class="mr-insignia mr-categoria mr-categoria--sin-codigo">Alta sin código</span>`
    : CATEGORIA_INSIGNIA[p.categoria]
      ? `<span class="mr-insignia mr-categoria mr-categoria--${CATEGORIA_INSIGNIA[p.categoria][0]}">${CATEGORIA_INSIGNIA[p.categoria][1]}</span>` : "";
  const pedido = p.recorrido.filter(r => r.tomo_pedido).map(r => r.id === eq.yo.id ? "vos" : corto(r.nombre));
  const meta = `<b>${escH(hora(p.llegada))}</b><span>· ${escH(personas(p.cantidad))}</span>`
    + (p.zona ? `<span>· ${escH(p.zona)}</span>` : "") + insignia
    + (pedido.length ? `<span class="mr-insignia mr-insignia--violeta">Pedido: ${escH(enumerar(pedido))}</span>` : "");
  const quienes = p.recorrido.filter(r => r.id !== eq.yo.id).map(r => corto(r.nombre)).concat(mio ? ["vos"] : []);
  const atiende = quienes.length
    ? `<p class="mr-atiende mr-atiende--recorrido">Recorrido: <b>${escH(enumerar(quienes))}</b></p>`
    : p.vendedor ? `<p class="mr-atiende">Lo atiende <b>${escH(p.vendedor)}</b>, su vendedor</p>`
      : `<p class="mr-atiende">Sin vendedor asignado</p>`;
  const boton = mio
    ? `<button class="mr-boton mr-boton--secundario" type="button" data-bajar="${escH(p.visita_id)}">Me bajo</button>`
    : `<button class="mr-boton mr-boton--anotarme" type="button" data-anotar="${escH(p.visita_id)}">Me anoto</button>`;
  const yoTome = mio && p.recorrido.some(r => r.id === eq.yo.id && r.tomo_pedido);
  return `<article class="mr-presente${mio ? " mr-presente--mio" : ""}" data-visita="${escH(p.visita_id)}"><div class="mr-presente-meta">${meta}</div>`
    + `<h3 class="mr-presente-razon">${escH(p.razon_social)}</h3>`
    + `<div class="mr-presente-pie">${atiende}${boton}</div>`
    // decidido el 07/10: solo si alguien del equipo (no el vendedor) tomó el pedido
    + (mio ? `<label class="mr-interruptor"><input type="checkbox" data-pedido="${escH(p.visita_id)}"${yoTome ? " checked" : ""}> Tomé el pedido</label>` : "")
    + `</article>`;
}

/* Me anoto / Me bajo / Tomé el pedido. Todo pasa por la cola, en orden:
   primero queda guardado en el celular (si se cierra la app no se pierde),
   se ve en el acto y sale enseguida; sin señal, sale cuando vuelve. Lo último
   que se tocó en una visita es lo que vale. */
function accionEquipo(fn, visita, tomo) {
  const args = { p_equipo: eq.yo.id, p_visita: visita };   // la clave se pone al enviar (conClaves)
  if (fn === "expo_tome_pedido") args.p_tomo = !!tomo;
  const misma = fn === "expo_tome_pedido" ? ["expo_tome_pedido"] : ["expo_anotarme", "expo_bajarme"];
  descartarPendientes(i => misma.includes(i.fn) && i.args.p_equipo === args.p_equipo && i.args.p_visita === visita);
  const id = encolar(fn, args);
  const { vista } = eq;
  alSalir(id, vista, (r, error) => {
    if (error) { eq.tostada = null; eq.aviso = mensajeDe(error); }
    cargarPresentes(vista);   // lo que quedó de verdad en la base
  });
  eq.aviso = "";
  mostrarTostada(fn, visita);
  repintarPresentes();
  procesarCola();
}

/* "Te anotaste con Libreria Papeltec · Deshacer", unos segundos. */
function mostrarTostada(fn, visita) {
  if (fn === "expo_bajarme") eq.tostada = null;
  if (fn !== "expo_anotarme") return;
  const p = eq.datos && (eq.datos.presentes || []).find(x => x.visita_id === visita);
  if (!p) return;
  const tostada = eq.tostada = { texto: "Te anotaste con " + nombreDelLocal(p.razon_social), visita };
  setTimeout(() => { if (eq && eq.tostada === tostada) { eq.tostada = null; repintarPresentes(); } }, TOSTADA_MS);
}

/* ==========================================================================
   4 · RECEPCIÓN EN VIVO  (#recepcion)
   Se entra con Google, como en la app de pedidos (decidido el 08/10), por el
   flujo normal de Supabase con PKCE: el login empieza en este navegador y
   vuelve con un ?code= que solo sirve con el verificador que quedó guardado
   acá. Un #access_token pegado en la URL no se acepta nunca (PROHIBIDOS).
   Quién puede ver la recepción lo decide la base (es_admin()), no la página.
   ========================================================================== */
const SESION = "expoSesion";              // { email, access_token, refresh_token, vence }
const PKCE = "expoPkce";                  // el verificador del login en curso
const REFRESCO_RECEPCION_MS = 30000;      // "Reintentamos cada 30 s"
const RELOJ_RECEPCION_MS = 5000;          // "Actualizado hace 10 s"
const FALTANTES_A_LA_VISTA = 3;           // por turno; el resto, con "Ver los 4 que faltan"
const RENOVAR_ANTES_MS = 60000;           // la sesión se renueva un minuto antes de vencer
const mqAncha = window.matchMedia("(min-width: 760px)");   // escritorio o tablet

/* ---------- login con Google (PKCE) ---------- */
function b64url(bytes) {
  let s = "";
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function retoPkce(verificador) {
  return b64url(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verificador))));
}
const urlDeVuelta = () => location.origin + location.pathname;   // a donde vuelve Google (sin # ni ?)

async function entrarConGoogle(boton) {
  const verificador = b64url(crypto.getRandomValues(new Uint8Array(48)));   // 64 caracteres
  // si el navegador no deja guardar, al volver de Google no habría con qué canjear
  if (!guardarLocal(PKCE, verificador)) {
    return pantallaLogin("Este navegador no deja guardar datos (¿modo privado?): así no se puede entrar.");
  }
  ocupar(boton, "Abriendo Google…");
  const u = new URL(SB_URL + "/auth/v1/authorize");
  u.searchParams.set("provider", "google");
  u.searchParams.set("redirect_to", urlDeVuelta());
  u.searchParams.set("code_challenge", await retoPkce(verificador));
  u.searchParams.set("code_challenge_method", "s256");
  u.searchParams.set("prompt", "select_account");   // en la compu compartida, que se vea con qué cuenta se entra
  location.assign(u.toString());
}

/* Si se vuelve de Google con "Atrás", el navegador restaura la página como
   estaba ("Abriendo Google…"): se vuelve a mostrar el botón. */
window.addEventListener("pageshow", e => { if (e.persisted && location.hash === "#recepcion" && !sesion()) pantallaLogin(); });

/* Llamada a la autenticación de Supabase (con el mismo tope que rpc(): una
   renovación colgada no puede frenar la recepción). */
async function auth(ruta, cuerpo) {
  const r = await postSupabase(`auth/v1/${ruta}`, cuerpo);
  let d = null;
  try { d = await r.json(); } catch (e) { /* vacía */ }
  if (!r.ok || !d || !d.access_token) throw new ErrorSesion((d && (d.error_code || d.error)) || "error_" + r.status);
  return d;
}

function guardarSesion(d, email) {
  const mail = (d.user && d.user.email) || email;
  if (!mail) throw new ErrorSesion("sin_mail");
  const s = { email: mail, access_token: d.access_token, refresh_token: d.refresh_token || "", vence: Date.now() + Number(d.expires_in || 3600) * 1000 };
  guardarLocal(SESION, s);
  return s;
}
const sesion = () => { const s = leerLocal(SESION); return s && s.access_token ? s : null; };

/* Vuelve de Google con ?code= (o ?error=). Se canjea solo si este navegador
   empezó el login: un link con el code de otro no sirve sin el verificador. */
async function volverDeGoogle() {
  const q = new URLSearchParams(location.search);
  const verificador = leerLocal(PKCE);
  borrarLocal(PKCE);
  history.replaceState(null, "", location.pathname + "#recepcion");   // el code no queda en la URL ni en el historial
  if (q.has("error") || q.has("error_description")) return pantallaLogin("Google no completó el ingreso. Probá de nuevo.");
  if (typeof verificador !== "string" || !q.get("code")) return pantallaLogin();
  cargando();
  try {
    guardarSesion(await auth("token?grant_type=pkce", { auth_code: q.get("code"), code_verifier: verificador }));
  } catch (e) {
    return pantallaLogin(e instanceof ErrorRed ? "Sin conexión: para entrar hace falta internet." : "No se pudo completar el ingreso. Probá de nuevo.");
  }
  abrirRecepcion();
}

/* El token de la sesión, renovado si está por vencer (una sola renovación a
   la vez: Supabase cambia el refresh_token en cada una). Si mientras tanto
   tocaron "Salir" (o entró otra cuenta), lo renovado no se guarda: se cierra. */
let renovando = null;
async function tokenValido(forzar = false) {
  const s = sesion();
  if (!s) throw new ErrorSesion("sin_sesion");
  if (!forzar && Date.now() < s.vence - RENOVAR_ANTES_MS) return s.access_token;
  if (!s.refresh_token) throw new ErrorSesion("sin_refresh");
  renovando = renovando || auth("token?grant_type=refresh_token", { refresh_token: s.refresh_token })
    .then(d => {
      const ahora = sesion();
      // si otra pestaña de la misma cuenta renovó a la vez, las dos sesiones sirven: se guarda esta
      if (!ahora || ahora.email !== s.email) {
        cerrarEnSupabase(d.access_token);
        throw new ErrorSesion("sesion_cerrada");
      }
      return guardarSesion(d, s.email);
    })
    .finally(() => { renovando = null; });
  return (await renovando).access_token;
}

/* RPC de recepción: con la sesión. Si la base dice que venció antes de
   tiempo (el reloj de la compu), se renueva una vez y se reintenta. */
async function rpcRecepcion(fn, args = {}) {
  try {
    return await rpc(fn, args, await tokenValido());
  } catch (e) {
    if (!(e instanceof ErrorSesion) || e.message !== "sesion_vencida") throw e;
    return rpc(fn, args, await tokenValido(true));
  }
}

/* Cierra en Supabase solo esta sesión (scope=local): la misma cuenta sigue
   entrada en la app de pedidos y en otras compus. */
function cerrarEnSupabase(token) {
  fetch(`${SB_URL}/auth/v1/logout?scope=local`, { method: "POST", headers: { apikey: SB_KEY, Authorization: "Bearer " + token } }).catch(() => {});
}

/* Las hojas (<dialog>) están fuera de #app: al cambiar de pantalla por la
   sesión no pueden quedar abiertas encima, con los datos de un cliente. */
const cerrarHojas = () => document.querySelectorAll("dialog").forEach(d => d.close());

function salir(mensaje = "") {
  const s = sesion();
  if (s) cerrarEnSupabase(s.access_token);
  borrarLocal(SESION);
  rec = null;   // lo último que se vio estaba solo en memoria: se va con ella
  cerrarHojas();
  pantallaLogin(mensaje);
}

/* La sesión ya no sirve (venció, o la cerraron): a entrar de nuevo. Lo demás sigue. */
function siEsDeSesion(e) {
  if (!(e instanceof ErrorSesion)) return false;
  salir("Tu sesión venció. Entrá de nuevo.");
  return true;
}

/* ---------- la sala (compu, sin datos) ---------- */
const ANIO_VISTO = "expoAnio";   // el año de la última expo que se vio (solo el número): para la sala antes de entrar
const SALA_TINTA = "#1f1a24", SALA_AMARILLO = "#c9b400", SALA_CELESTE = "#00a8e2", SALA_FONDO = "246, 242, 234";
const nombreDeLaExpo = anio => "Expo Mooving" + (anio ? " " + anio : "");

/* titulo: texto plano. textos, aviso y acciones: marcado ya escapado.
   datos: [{ valor, rotulo }] en texto plano (acá se escapan). */
function sala({ anio, titulo, textos = "", aviso: arriba = "", acciones = "", datos = [] }) {
  const nombre = nombreDeLaExpo(anio);
  return `<div class="sala-recepcion" data-theme="light" data-sala="${escH(nombre)}">`
    + `<canvas aria-hidden="true"></canvas><p class="mr-oculto">${escH(nombre)}</p>`
    + `<p class="sala-rotulo">Recepción</p>`
    + `<div class="sala-pie"><div class="sala-mensaje">${arriba}<h1 class="sala-titulo">${escH(titulo)}</h1>${textos}`
    + (acciones ? `<div class="sala-acciones">${acciones}</div>` : "") + `</div>`
    + (datos.length ? `<div class="sala-datos">${datos.map(d => `<div class="sala-dato"><span class="sala-dato-valor">${escH(d.valor)}</span><span class="sala-dato-rotulo">${escH(d.rotulo)}</span></div>`).join("")}</div>` : "")
    + `</div></div>`;
}

/* Pone en marcha las partículas de la sala que haya en pantalla (una vez por
   sala). Se apaga sola: cuando se acomodan deja de dibujar, y vuelve con el
   cursor o un toque; cuando la sala sale de la pantalla, se termina. */
async function encenderSala() {
  const el = document.querySelector(".sala-recepcion:not([data-encendida])");
  if (!el) return;
  el.dataset.encendida = "1";
  const cv = el.querySelector("canvas"), c = cv.getContext("2d");
  const quieta = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dp = Math.min(2, window.devicePixelRatio || 1);
  let W = 0, H = 0, P = [], raton = { x: -999, y: -999 }, andando = false;
  try { await document.fonts.load("italic 80px 'Instrument Serif'", "Expo Mooving"); } catch (e) { /* va con la de respaldo */ }

  // Los puntos de la palabra: se escribe en un lienzo aparte y se toman los píxeles.
  function puntos() {
    const texto = el.dataset.sala;
    const o = document.createElement("canvas"); o.width = W; o.height = H;
    const g = o.getContext("2d");
    let t = Math.min(H * 0.26, 220);
    const fuente = tam => `italic 400 ${tam}px "Instrument Serif", Georgia, serif`;
    g.font = fuente(t);
    while (g.measureText(texto).width > W * 0.86 && t > 24) { t -= 2; g.font = fuente(t); }
    g.textBaseline = "middle";
    const oo = texto.indexOf("Mooving") + 1;   // la doble O de Mooving, en los colores del logo
    let x = W / 2 - g.measureText(texto).width / 2;
    Array.from(texto).forEach((letra, i) => {
      g.fillStyle = i === oo ? "#ff0" : i === oo + 1 ? "#0ff" : "#fff";
      g.fillText(letra, x, H * 0.4);
      x += g.measureText(letra).width;
    });
    const d = g.getImageData(0, 0, W, H).data, pts = [];
    for (let y = 0; y < H; y += 3) for (let px = 0; px < W; px += 3) {
      const k = (y * W + px) * 4;
      if (d[k + 3] > 128) pts.push([px, y, d[k + 2] < 100 ? SALA_AMARILLO : d[k] < 100 ? SALA_CELESTE : SALA_TINTA]);
    }
    return pts;
  }
  function armar() {
    const b = el.getBoundingClientRect();
    if (!b.width || !b.height) return;
    W = Math.round(b.width); H = Math.round(b.height);
    cv.width = W * dp; cv.height = H * dp; c.setTransform(dp, 0, 0, dp, 0, 0);
    const T = puntos();
    while (P.length < T.length) P.push({ x: Math.random() * W, y: H + 20, vx: 0, vy: 0, s: Math.random() * 1.3 + 1.1 });
    P.length = T.length;
    P.forEach((p, i) => { [p.tx, p.ty, p.c] = T[i]; if (quieta) { p.x = p.tx; p.y = p.ty; } });
    andar();
  }
  function dibujar(rastro) {
    c.fillStyle = `rgba(${SALA_FONDO}, ${rastro ? 0.32 : 1})`;
    c.fillRect(0, 0, W, H);
    for (const p of P) { c.fillStyle = p.c; c.fillRect(p.x, p.y, p.s, p.s); }
  }
  function cuadro() {
    if (!el.isConnected) { andando = false; return; }   // la sala ya no está: se termina
    let mov = 0;
    for (const p of P) {
      const dx = p.x - raton.x, dy = p.y - raton.y, d2 = dx * dx + dy * dy;
      if (d2 < 8000) { const f = (8000 - d2) / 8000 * 2.6, d = Math.sqrt(d2) || 1; p.vx += dx / d * f; p.vy += dy / d * f; }
      p.vx = (p.vx + (p.tx - p.x) * 0.014) * 0.85;
      p.vy = (p.vy + (p.ty - p.y) * 0.014) * 0.85;
      p.x += p.vx; p.y += p.vy;
      mov = Math.max(mov, Math.abs(p.vx) + Math.abs(p.vy));
    }
    dibujar(true);
    if (mov < 0.02 && raton.x < -900) { dibujar(false); andando = false; return; }   // acomodadas: deja de dibujar
    requestAnimationFrame(cuadro);
  }
  function andar() {
    if (quieta) return dibujar(false);
    if (!andando) { andando = true; requestAnimationFrame(cuadro); }
  }
  cv.addEventListener("pointermove", e => { const b = cv.getBoundingClientRect(); raton.x = e.clientX - b.left; raton.y = e.clientY - b.top; andar(); });
  cv.addEventListener("pointerleave", () => { raton.x = raton.y = -999; andar(); });
  cv.addEventListener("pointerdown", e => {   // un toque las dispersa y se vuelven a juntar
    if (quieta) return;
    const b = cv.getBoundingClientRect(), mx = e.clientX - b.left, my = e.clientY - b.top;
    for (const p of P) { const dx = p.x - mx, dy = p.y - my, d = Math.hypot(dx, dy) || 1, f = Math.min(40, 3200 / d); p.vx += dx / d * f; p.vy += dy / d * f; }
    andar();
  });
  new ResizeObserver(() => { if (el.isConnected) armar(); }).observe(el);
}

/* ---------- pantallas de entrada (no están dibujadas: piezas del diseño;
   en la compu, la sala) ---------- */
function pantallaLogin(mensaje = "") {
  const error = mensaje ? aviso({ tipo: "error", icono: ICONO.atencion, titulo: "No se pudo entrar", texto: escH(mensaje), textoChico: true }) : "";
  const boton = `<button class="mr-boton mr-boton--principal" type="button" id="google">Entrar con Google</button>`;
  const texto = `<p class="mr-chico">Entrá con tu cuenta de Google de Mooving, la misma de la app de pedidos.</p>`;
  const vista = pintar(mqAncha.matches
    ? pantalla({ datos: ["Recepción"], ancha: true, arriba: false, cuerpo: sala({ anio: leerLocal(ANIO_VISTO), titulo: "Entrá con tu cuenta de Google",
      textos: `<p class="mr-chico">La misma de la app de pedidos.</p>`, aviso: error, acciones: boton }) })
    : pantalla({
      datos: ["Recepción"],
      cuerpo: error + estado({ icono: ICONO.personas, titulo: "Recepción de la expo", grande: false, textos: texto }),
      barra: boton,
    }));
  $("#google").onclick = () => entrarConGoogle($("#google"));
  encenderSala();
  return vista;
}

function pantallaSinAcceso() {
  const s = sesion();
  rec = null;
  cerrarHojas();
  const titulo = "Tu cuenta no tiene acceso a recepción";
  const texto = `<p class="mr-chico">Entraste como <b style="color:var(--tinta);overflow-wrap:anywhere">${escH(s ? s.email : "")}</b>. Pedile a quien administra la app de pedidos que te sume como admin.</p>`;
  const boton = `<button class="mr-boton mr-boton--secundario mr-boton--ancho" type="button" id="otra">Entrar con otra cuenta</button>`;
  const vista = pintar(mqAncha.matches
    ? pantalla({ datos: ["Recepción"], ancha: true, arriba: false, cuerpo: sala({ anio: leerLocal(ANIO_VISTO), titulo, textos: texto, acciones: boton }) })
    : pantalla({
      datos: ["Recepción"],
      cuerpo: estado({ tipo: "error", icono: ICONO.invalido, titulo, grande: false, textos: texto }),
      barra: boton,
    }));
  $("#otra").onclick = () => salir();
  encenderSala();
  return vista;
}

/* ---------- la recepción ---------- */
/* La pantalla abierta: { vista, ancha (escritorio o celular), datos
   (expo_recepcion), vistoEn, fallo, pedido (número del último pedido),
   vendedor (filtro), abiertos (turnos con "Ver los que faltan" tocado) }.
   Lo que se vio queda solo en memoria. */
let rec = null;

const fmtMinutosAR = new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: TZ });
function minutosAR(fecha = new Date()) {   // 10:42 en Argentina → 642
  const [h, m] = fmtMinutosAR.format(fecha).split(":").map(Number);
  return h * 60 + m;
}
const minutosDe = t => { const [h, m] = String(t).split(":").map(Number); return h * 60 + (m || 0); };
const duracion = min => min < 60 ? `${min} min` : `${Math.floor(min / 60)} h ${String(min % 60).padStart(2, "0")}`;   // "1 h 42"
const cuantosClientes = n => n === 1 ? "1 cliente" : n + " clientes";
const fmtDecimal = new Intl.NumberFormat("es-AR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });   // "2,1"
function hace(desde) {
  const s = Math.max(0, Math.round((Date.now() - desde) / 1000));
  return s < 60 ? `hace ${s} s` : `hace ${Math.floor(s / 60)} min`;
}
/* "27284551203" → "27-28455120-3"; lo que no es un CUIT, tal cual */
function formatoCuit(t) {
  const d = soloDigitos(t);
  return d.length === LARGO_CUIT && /^[\d\s.-]+$/.test(t) ? `${d.slice(0, 2)}-${d.slice(2, 10)}-${d.slice(10)}` : String(t || "");
}
const DIJO_SER = {
  cliente: "Cliente de Mooving", cliente_de_cliente: "Viene con un cliente",
  proveedor: "Proveedor", comex: "Comex", licencia: "Agente de licencias",
};
const DICE = { cliente: "dice ser cliente", cliente_de_cliente: "viene con un cliente" };
const LARGO_CUIT = 11;            // igual que expo_buscar_cliente
const MIN_LETRAS_VINCULAR = 2;    // igual que expo_buscar_cliente
/* Las formas societarias no sirven para buscar: "Librería Arco S.R.L." buscaría "srl". */
const SOCIEDADES = new Set(["sa", "srl", "sas", "sh", "sc", "hnos", "ltda", "saic", "saci", "sacifi", "coop"]);
const soloDigitos = t => String(t || "").replace(/\D/g, "");

/* Lo que se busca primero al abrir la hoja: el código, si lo cargó en vez
   del CUIT; si no, la última palabra con sentido de la empresa ("kalu"). */
function busquedaInicial(alta) {
  const digitos = soloDigitos(alta.cuit);
  if (digitos && digitos.length !== LARGO_CUIT) return digitos;
  const palabras = normalizar(alta.empresa).split(" ").filter(w => w.length >= 3 && !SOCIEDADES.has(w));
  return palabras.pop() || normalizar(alta.empresa);
}

function abrirRecepcion() {
  if (!sesion()) return pantallaLogin();
  rec = { vista: 0, ancha: mqAncha.matches, datos: null, vistoEn: null, fallo: false, pedido: 0, vendedor: "", abiertos: new Set() };
  pintarRecepcion();
  cargarRecepcion();
  // mientras siga esta recepción en pantalla (pasar a escritorio la repinta, pero es la misma)
  const yo = rec, sigue = () => rec === yo && yo.vista === vistaN;
  const datos = setInterval(() => (sigue() ? cargarRecepcion() : clearInterval(datos)), REFRESCO_RECEPCION_MS);
  const reloj = setInterval(() => (sigue() ? repintarRecepcion() : clearInterval(reloj)), RELOJ_RECEPCION_MS);
}

async function cargarRecepcion() {
  const yo = rec, n = ++yo.pedido;
  // lo que llega tarde (un pedido anterior al último) no pisa lo nuevo
  const vigente = () => rec === yo && vistaN === yo.vista && n === yo.pedido;
  try {
    const datos = await rpcRecepcion("expo_recepcion");
    if (!vigente()) return;
    Object.assign(yo, { datos, vistoEn: Date.now(), fallo: false });
    if (datos && datos.anio) guardarLocal(ANIO_VISTO, datos.anio);
  } catch (e) {
    if (!vigente()) return;
    if (siEsDeSesion(e)) return;
    if (e instanceof ErrorServidor && e.message === "expo_solo_admin") return pantallaSinAcceso();
    yo.fallo = true;
  }
  repintarRecepcion();
}

/* La pantalla entera: al abrir y cuando pasa de celular a escritorio. */
function pintarRecepcion() {
  const ancha = mqAncha.matches;
  rec.vista = pintar(pantalla({
    datos: ["Recepción", ""], ancha, arriba: false, cuerpo: "",
    extra: `<div class="pie-salir" style="padding:0 var(--esp-4) var(--esp-6);text-align:center"><button class="mr-boton mr-boton--texto" type="button" id="salir">Salir</button></div>`,
  }));
  rec.ancha = ancha;
  $("#salir").onclick = () => salir();
  // los toques del tablero se atienden acá una sola vez (se repinta seguido)
  const cuerpo = $("#app .mr-cuerpo");
  cuerpo.addEventListener("click", tocarEnRecepcion);
  cuerpo.addEventListener("change", tocarEnRecepcion);
  repintarRecepcion();
}
mqAncha.addEventListener("change", () => { if (rec && rec.vista === vistaN) pintarRecepcion(); });

function tocarEnRecepcion(e) {
  const t = e.target;
  if (e.type === "change" && t.id === "vendedor") { rec.vendedor = t.value; return repintarRecepcion(); }
  if (e.type !== "click") return;
  const b = t.closest("button");
  if (!b) return;
  if (b.dataset.ver) { rec.abiertos.add(b.dataset.ver); return repintarRecepcion(); }
  if (b.dataset.vincular) return abrirVincular(b.dataset.vincular);
  if ("salir" in b.dataset) return salir();   // el de la sala
}

/* Cabecera y cuerpo con lo que hay ahora (solo cambia lo que cambió: el
   foco y el filtro quedan donde estaban). */
function repintarRecepcion() {
  if (!rec || rec.vista !== vistaN) return;
  const d = rec.datos, ancha = rec.ancha;
  const ahora = minutosAR();
  const antesDeAbrir = d && d.es_dia && d.estado === "en_curso" && ahora < minutosDe(d.hora_apertura)
    && !d.cifras.clientes && !d.cifras.no_clientes;
  const [linea1, linea2] = $("#app .mr-cabecera-dato").children;
  linea1.textContent = d && d.hoy ? cabeceraRecepcion(d, ancha) : "Recepción";
  linea2.textContent = rec.fallo || antesDeAbrir || !rec.vistoEn ? hora(Date.now())
    : (ancha ? "Actualizado " : "") + hace(rec.vistoEn);

  const cuerpo = $("#app .mr-cuerpo");
  const { html, hueco } = cuerpoRecepcion(d, ancha, ahora, antesDeAbrir);
  cuerpo.style.gap = hueco || "";
  const volverAlFoco = focoEnRecepcion();
  cambiarSiHaceFalta(cuerpo, html);
  volverAlFoco();
  encenderSala();
}

/* "Recepción · Miércoles 15 · día 2 de 3" (escritorio) / "Recepción · Mié 15" */
function cabeceraRecepcion(d, ancha) {
  if (!ancha) return "Recepción · " + diaCorto(d.hoy);
  const i = (d.dias || []).indexOf(d.hoy);
  return `Recepción · ${capital(diaLargo(d.hoy))}` + (i >= 0 ? ` · día ${i + 1} de ${d.dias.length}` : "");
}

/* Qué tenía el foco (el filtro, "Vincular", "Ver los que faltan") para devolvérselo. */
function focoEnRecepcion() {
  const a = document.activeElement;
  const cuerpo = $("#app .mr-cuerpo");
  if (!a || !cuerpo.contains(a)) return () => {};
  const selector = a.id === "vendedor" ? "#vendedor"
    : a.dataset.vincular ? `[data-vincular="${a.dataset.vincular}"]`
    : a.dataset.ver ? `[data-ver="${a.dataset.ver}"]` : null;
  return () => {
    const otro = selector && cuerpo.querySelector(selector);
    if (otro) return otro !== document.activeElement && otro.focus({ preventScroll: true });
    // "Ver los que faltan" ya no está (se abrió el turno): el foco va al título del turno
    const titulo = a.dataset.ver && cuerpo.querySelector(`[data-grupo="${a.dataset.ver}"] h3`);
    if (titulo) { titulo.setAttribute("tabindex", "-1"); titulo.focus({ preventScroll: true }); }
  };
}

function cuerpoRecepcion(d, ancha, ahora, antesDeAbrir) {
  const fallo = rec.fallo
    ? aviso({ tipo: "error", titulo: rec.vistoEn ? "No se pudo actualizar" : "No se pudo cargar la recepción", textoChico: true,
      texto: (rec.vistoEn ? `Mostramos lo de las ${escH(hora(rec.vistoEn))}. ` : "") + `Reintentamos cada ${REFRESCO_RECEPCION_MS / 1000} s.` })
    : "";
  if (!d) return { html: fallo || `<span class="mr-girando" role="status" aria-label="Cargando" style="align-self:center;margin-top:var(--esp-6)"></span>` };
  // sin datos para mostrar: en la compu, la sala (el título es texto plano); en
  // el celular, el estado de siempre
  const sinDatos = (m, extra, datos, textosAncha = m.textos) => ({
    html: ancha
      ? sala({ anio: d.anio, titulo: m.titulo, textos: textosAncha, aviso: fallo, datos,
        acciones: `<button class="mr-boton mr-boton--secundario" type="button" data-salir>Salir</button>` })
      : fallo + estado({ ...m, titulo: escH(m.titulo), grande: false }) + extra,
  });
  if (d.estado === "sin_edicion") {
    return sinDatos({ icono: ICONO.reloj, titulo: "No hay una expo abierta",
      textos: `<p class="mr-chico">Cuando se cree la edición, acá se ve la recepción del día.</p>` }, "", []);
  }
  if (!d.es_dia) return sinDatos(hoyNoHayExpo(d), ayer(d), datosHoyNoHayExpo(d));
  // antes de abrir, en la compu el detalle va en los bloques
  if (antesDeAbrir) return sinDatos(abreALas(d), ayer(d), datosAntesDeAbrir(d), "");

  const previa = d.estado !== "en_curso"
    ? aviso({ tipo: "atencion", titulo: "La expo todavía figura «antes de la expo»", textoChico: true,
      texto: "Hoy es día de expo, pero el QR de los clientes sigue diciendo «Confirmo que voy». Pasá la edición a en curso." })
    : "";
  // el filtro por vendedor está solo en escritorio: en el celular no se ve, así que no filtra
  const faltantes = d.faltantes.filter(f => !ancha || !rec.vendedor || f.vendedor === rec.vendedor);
  const todosLlegaron = d.con_turno > 0 && !d.faltantes.length;
  const listas = todosLlegaron ? llegaronTodos(d) : d.con_turno ? listaDeFaltantes(d, faltantes, ancha, ahora) : "";
  const costado = altasSinCodigo(d) + noClientesHoy(d);
  if (ancha) {
    return { html: fallo + previa + cifrasRecepcion(d, true, ahora)
      + `<div style="display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:var(--esp-6);align-items:start">`
      + `<section style="display:flex;flex-direction:column;gap:var(--esp-4)">${listas}</section>`
      + `<div style="display:flex;flex-direction:column;gap:var(--esp-6)">${costado}</div></div>` };
  }
  return { html: fallo + previa + cifrasRecepcion(d, false, ahora) + listas + costado, hueco: "var(--esp-4)" };
}

const cifra = (valor, pie, clase = "") =>
  `<div class="mr-cifra${clase ? " " + clase : ""}"><span class="mr-cifra-valor">${valor}</span><span class="mr-cifra-pie">${pie}</span></div>`;

function cifrasRecepcion(d, ancha, ahora) {
  const c = d.cifras, con = d.con_turno, faltan = d.faltantes.length;
  const atrasados = d.faltantes.filter(f => ahora >= minutosDe(f.hasta)).length;
  const valorFaltan = `${faltan} <small>de ${con}</small>`;
  const claveFaltan = faltan ? " mr-cifra--clave" : "";
  if (ancha) {
    return `<div class="mr-cifras">`
      + cifra(c.clientes, "clientes llegaron" + (c.sin_turno ? ` · ${c.sin_turno} sin turno hoy` : ""))
      + cifra(c.personas, "personas" + (c.clientes ? ` · ${fmtDecimal.format(c.personas / c.clientes)} por cliente` : ""))
      + cifra(`${c.no_clientes} <small>· ${c.no_clientes_personas} pers.</small>`, "no clientes, fuera de las cifras")
      + (con ? cifra(valorFaltan, faltan ? "con turno hoy todavía no llegaron" : "faltantes", claveFaltan.trim()) : "")
      + `</div>`;
  }
  const pieFaltan = faltan
    ? "con turno hoy todavía no llegaron" + (atrasados ? ` · ${atrasados === 1 ? "1 atrasado" : atrasados + " atrasados"}` : "")
    : "faltantes";
  return `<div class="mr-cifras mr-cifras--2">`
    + cifra(c.clientes, "clientes") + cifra(c.personas, "personas")
    + (con ? cifra(valorFaltan, pieFaltan, "mr-cifra--ancha" + claveFaltan) : "")
    + `</div>`;
}

/* Los faltantes, agrupados por turno; los de más tarde, solo la cuenta. */
function listaDeFaltantes(d, faltantes, ancha, ahora) {
  const titulo = ancha
    ? `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h2 class="mr-titulo">Tenían turno hoy y no llegaron</h2>${filtroVendedor(d)}</div>`
    : `<h2 class="mr-subtitulo">Tenían turno hoy y no llegaron</h2>`;
  const grupos = new Map();
  for (const f of faltantes) {
    const k = f.desde + "-" + f.hasta;
    if (!grupos.has(k)) grupos.set(k, []);
    grupos.get(k).push(f);
  }
  if (!grupos.size) {
    return titulo + estado({ icono: ICONO.lupa, titulo: `Ningún faltante de ${escH(rec.vendedor)}`, grande: false });
  }
  return titulo + Array.from(grupos, ([k, lista]) => grupoDeTurno(k, lista, ahora)).join("");
}

function grupoDeTurno(k, lista, ahora) {
  const { desde, hasta } = lista[0];
  const turno = `Turno ${horario({ desde, hasta })}`;
  if (ahora < minutosDe(desde)) {
    return `<div data-grupo="${escH(k)}"><div class="mr-grupo-titulo"><h3 class="mr-etiqueta">${escH(turno)} · ${lista.length}</h3><span class="mr-chico">más tarde</span></div></div>`;
  }
  const termino = ahora >= minutosDe(hasta);
  const lado = termino ? `terminó hace ${duracion(ahora - minutosDe(hasta))}` : "en curso";
  const insignia = termino
    ? `<span class="mr-insignia mr-insignia--atencion">Atrasado ${escH(duracion(ahora - minutosDe(desde)))}</span>`
    : `<span class="mr-insignia">En su turno</span>`;
  const abierto = rec.abiertos.has(k) || lista.length <= FALTANTES_A_LA_VISTA;
  const visibles = abierto ? lista : lista.slice(0, FALTANTES_A_LA_VISTA);
  const resto = lista.length - visibles.length;
  return `<div data-grupo="${escH(k)}"><div class="mr-grupo-titulo"><h3 class="mr-etiqueta">${escH(turno)} · faltan ${lista.length}</h3><span class="mr-chico">${escH(lado)}</span></div>`
    + `<ul class="mr-lista">${visibles.map(f => `<li class="mr-falta"><span class="mr-falta-razon">${escH(f.razon_social)}</span>`
      + `<span class="mr-falta-datos">${[f.localidad, f.zona, f.vendedor].filter(Boolean).map(escH).join(" · ")}</span>`
      + `<span class="mr-falta-lado"><span class="mr-chico" style="display:block">${escH(horario(f))}</span>${insignia}</span></li>`).join("")}`
    + (resto ? `<li class="mr-falta"><button class="mr-boton mr-boton--texto" style="padding:0" type="button" data-ver="${escH(k)}">${resto === 1 ? "Ver el que falta" : `Ver los ${resto} que faltan`}</button></li>` : "")
    + `</ul></div>`;
}

function filtroVendedor(d) {
  const vendedores = [...new Set(d.faltantes.map(f => f.vendedor).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
  if (rec.vendedor && !vendedores.includes(rec.vendedor)) vendedores.push(rec.vendedor);
  return `<select class="mr-select" id="vendedor" aria-label="Vendedor"><option value="">Todos los vendedores</option>`
    + vendedores.map(v => `<option value="${escH(v)}"${v === rec.vendedor ? " selected" : ""}>${escH(v)}</option>`).join("") + `</select>`;
}

function llegaronTodos(d) {
  const n = d.altas.length;
  return estado({
    tipo: "ok", icono: ICONO.ok, titulo: "Llegaron todos los turnos de hoy", grande: false, estilo: "padding:var(--esp-6) 0",
    textos: n ? `<p class="mr-chico">${n === 1 ? "Queda 1 alta sin código para vincular." : `Quedan ${n} altas sin código para vincular.`}</p>` : "",
  });
}

function altasSinCodigo(d) {
  if (!d.altas.length) return "";
  return `<div><div class="mr-grupo-titulo"><h3 class="mr-etiqueta">Altas sin código · ${d.altas.length}</h3></div>`
    + `<ul class="mr-lista">${d.altas.map(a => {
      const cuando = a.llegada ? (a.dia && a.dia !== d.hoy ? diaCorto(a.dia) + ", " : "") + hora(a.llegada) : "";
      const datos = [a.nombre, DICE[a.categoria], cuando].filter(Boolean).map(escH).join(" · ");
      return `<li class="mr-falta"><span class="mr-falta-razon">${escH(a.empresa)}</span><span class="mr-falta-datos">${datos}</span>`
        + `<span class="mr-falta-lado"><button class="mr-boton mr-boton--secundario" style="min-height:40px" type="button" data-vincular="${escH(a.id)}">Vincular</button></span></li>`;
    }).join("")}</ul>`
    + `<p class="mr-chico" style="margin-top:6px">Sin código no entran en el cruce con facturación.</p></div>`;
}

function noClientesHoy(d) {
  if (!d.no_clientes.length) return "";
  return `<div><div class="mr-grupo-titulo"><h3 class="mr-etiqueta">No clientes hoy</h3></div><ul class="mr-lista">`
    + d.no_clientes.map(n => {
      const [clase, texto] = CATEGORIA_INSIGNIA[n.categoria] || ["", "No es cliente"];
      const insignia = `<span class="mr-insignia${clase ? ` mr-categoria mr-categoria--${clase}` : ""}">${escH(texto)}</span>`;
      return `<li class="mr-falta"><span class="mr-falta-razon">${insignia}</span><span class="mr-falta-lado mr-cuenta">${n.cantidad} · ${n.personas} pers.</span></li>`;
    }).join("") + `</ul></div>`;
}

/* "Antes de abrir": lo que viene ({ icono, titulo, textos }: estado o sala; el título, texto plano). */
function abreALas(d) {
  const primero = primerTurno(d);
  return {
    icono: ICONO.reloj, titulo: `Abre a las ${apertura(d.hora_apertura)}`,
    textos: `<p class="mr-chico"><b style="color:var(--tinta)">${cuantosClientes(d.con_turno)}</b> ${d.con_turno === 1 ? "tiene" : "tienen"} turno hoy.`
      + (primero.length ? ` El primero, de ${escH(horario(primero[0]))}: ${cuantosClientes(primero.length)}.` : "") + `</p>`,
  };
}

function hoyNoHayExpo(d) {
  const proximo = (d.dias || []).find(x => x > d.hoy);
  return {
    icono: ICONO.reloj, titulo: "Hoy no hay expo",
    // "empieza" si todavía no hubo ningún día; "sigue" si ya hubo
    textos: `<p class="mr-chico">${proximo ? `La expo ${escH(d.anio)} ${d.dias[0] > d.hoy ? "empieza" : "sigue"} el ${escH(diaLargo(proximo))}.` : `La expo ${escH(d.anio)} ya terminó sus días.`}</p>`,
  };
}

/* Los datos de la sala en la compu (texto plano: los escapa sala()). */
const primerTurno = d => d.faltantes.length ? d.faltantes.filter(f => f.desde === d.faltantes[0].desde && f.hasta === d.faltantes[0].hasta) : [];
function datosDeAyer(d) {
  if (!d.ayer) return [];
  const cuando = diasEntre(d.ayer.dia, d.hoy) === 1 ? "ayer" : "el " + diaLargo(d.ayer.dia);
  return [
    { valor: d.ayer.clientes, rotulo: `clientes ${cuando}` },
    { valor: d.ayer.personas, rotulo: `personas ${cuando}` },
  ];
}
function datosAntesDeAbrir(d) {
  const primero = primerTurno(d);
  const faltan = Math.max(1, minutosDe(d.hora_apertura) - minutosAR());
  return [
    { valor: duracion(faltan), rotulo: "para abrir las puertas" },
    { valor: d.con_turno, rotulo: "clientes con turno hoy" },
    ...(primero.length ? [{ valor: primero.length, rotulo: `en el primer turno, de ${horario(primero[0])}` }] : []),
    ...datosDeAyer(d),
  ];
}
function datosHoyNoHayExpo(d) {
  const proximo = (d.dias || []).find(x => x > d.hoy);
  return [
    ...(proximo ? [{ valor: diaCorto(proximo), rotulo: `${d.dias[0] > d.hoy ? "empieza" : "sigue"} la expo ${d.anio}` }] : []),
    { valor: (d.dias || []).length, rotulo: `días de expo ${d.anio}` },
    ...datosDeAyer(d),
  ];
}

/* "Ayer · martes 14" con las dos cifras del último día. */
function ayer(d) {
  if (!d.ayer) return "";
  const rotulo = diasEntre(d.ayer.dia, d.hoy) === 1 ? "Ayer" : "Último día";
  return `<div class="mr-grupo-titulo"><h3 class="mr-etiqueta">${rotulo} · ${escH(diaLargo(d.ayer.dia))}</h3></div>`
    + `<div class="mr-cifras mr-cifras--2">${cifra(d.ayer.clientes, "clientes")}${cifra(d.ayer.personas, "personas")}</div>`;
}

/* ---------- Vincular un alta ---------- */
/* La hoja abierta: { dlg, alta, codigo (el elegido), n (última búsqueda),
   ocupado (guardando: no se cambia ni se cierra hasta que conteste) }.
   Todo se busca adentro de su propia hoja (v.en), nunca en la página. */
function abrirVincular(id) {
  const a = rec && rec.datos && rec.datos.altas.find(x => x.id === id);
  if (!a || document.querySelector("dialog.velo")) return;
  const cuando = (a.dia ? diaCorto(a.dia) : "") + (a.llegada ? ", " + hora(a.llegada) : "");
  const ficha = [
    a.nombre && ["Se registró", escH(a.nombre)],
    ["Dijo ser", escH(DIJO_SER[a.categoria] || a.categoria)],
    a.cuit && ["CUIT que cargó", `<span class="mr-num">${escH(formatoCuit(a.cuit))}</span>`],
    a.cantidad && ["Vinieron", escH(personas(a.cantidad))],
  ].filter(Boolean).map(([dt, dd]) => `<dt>${dt}</dt><dd>${dd}</dd>`).join("");
  const inicial = busquedaInicial(a);

  const dlg = document.createElement("dialog");
  dlg.className = "velo";
  dlg.setAttribute("aria-labelledby", "vTitulo");
  dlg.innerHTML = `<div class="mr-hoja mr">`
    + `<div class="mr-hoja-cabeza"><div><p class="mr-etiqueta">Alta sin código${cuando ? " · " + escH(cuando) : ""}</p>`
    + `<h2 id="vTitulo" class="mr-titulo" style="margin-top:6px">${escH(a.empresa)}</h2></div>`
    + `<button class="mr-hoja-cerrar" type="button" aria-label="Cerrar" data-v="cerrar">×</button></div>`
    + `<dl class="mr-ficha">${ficha}</dl>`
    + `<div><p class="mr-subtitulo" id="vPregunta" style="margin-bottom:12px">¿Quién es en Finnegans?</p>`
    + `<label class="mr-buscador" style="margin-bottom:12px">${ICONO.lupa}<span class="mr-oculto">Buscar cliente</span>`
    + `<input class="mr-entrada" type="search" data-v="buscar" autocomplete="off" maxlength="80" style="min-height:44px;font-size:15px" value="${escH(inicial)}"></label>`
    + `<div data-v="resultados"></div></div>`
    + `<div data-v="error" style="display:contents"></div>`
    + `<div class="mr-hoja-pie"><button class="mr-boton mr-boton--principal" type="button" data-v="vincular" style="width:auto;min-height:48px;font-size:16px;padding:0 22px" disabled>Vincular</button>`
    + `<span class="mr-chico mr-empuja">¿No está en Finnegans?</span>`
    + `<button class="mr-boton mr-boton--secundario mr-boton--chico" type="button" data-marcar="cliente_nuevo">Es cliente nuevo</button>`
    + `<button class="mr-boton mr-boton--secundario mr-boton--chico" type="button" data-marcar="no_cliente">No es cliente</button></div></div>`;
  document.body.appendChild(dlg);

  const v = { dlg, alta: a, codigo: null, n: 0, ocupado: false, en: nombre => dlg.querySelector(`[data-v="${nombre}"]`) };
  dlg.addEventListener("close", () => dlg.remove());
  // mientras guarda no se cierra: quien la cierra cree que canceló, y no
  dlg.addEventListener("cancel", e => { if (v.ocupado) e.preventDefault(); });
  v.en("cerrar").onclick = () => { if (!v.ocupado) dlg.close(); };
  dlg.showModal();
  // en la compu, el foco va directo a la búsqueda (en el celular no: abriría el teclado)
  if (mqAncha.matches) v.en("buscar").focus();

  let demoraV = null;
  v.en("buscar").addEventListener("input", () => { clearTimeout(demoraV); demoraV = setTimeout(() => buscarEnFinnegans(v), DEMORA_BUSQUEDA_MS); });
  v.en("resultados").addEventListener("change", e => { if (e.target.name === "vinc") elegir(v, e.target.value); });
  v.en("vincular").onclick = () => resolverAlta(v, "expo_vincular", { p_alta: a.id, p_codigo: v.codigo }, v.en("vincular"));
  dlg.querySelectorAll("[data-marcar]").forEach(b => {
    b.onclick = () => resolverAlta(v, "expo_marcar_alta", { p_alta: a.id, p_estado: b.dataset.marcar }, b);
  });
  buscarEnFinnegans(v);
}

/* El botón dice siempre el código que se va a mandar. */
function elegir(v, codigo) {
  v.codigo = codigo;
  const b = v.en("vincular");
  b.disabled = !codigo || v.ocupado;
  b.textContent = codigo ? "Vincular a " + codigo : "Vincular";
}

async function buscarEnFinnegans(v) {
  if (v.ocupado) return;
  const texto = v.en("buscar").value, n = ++v.n;
  const caja = v.en("resultados");
  const alcanza = normalizar(texto).replace(/ /g, "").length >= MIN_LETRAS_VINCULAR
    || soloDigitos(v.alta.cuit).length === LARGO_CUIT || soloDigitos(texto).length === LARGO_CUIT;
  if (!alcanza) {
    caja.innerHTML = `<p class="mr-chico">Escribí al menos ${MIN_LETRAS_VINCULAR} letras, el código o el CUIT.</p>`;
    return elegir(v, null);
  }
  caja.innerHTML = `<span class="mr-girando" role="status" aria-label="Buscando"></span>`;
  let filas;
  try {
    filas = await rpcRecepcion("expo_buscar_cliente", { p_texto: texto, p_cuit: v.alta.cuit || null });
  } catch (e) {
    if (n !== v.n || !caja.isConnected) return;
    if (siEsDeSesion(e)) return;   // salir() cierra la hoja
    caja.innerHTML = avisoFino({ tipo: "error", icono: ICONO.sinRed, rol: "alert", texto: "No se pudo buscar. Revisá la conexión." });
    return elegir(v, null);
  }
  if (n !== v.n || !caja.isConnected || v.ocupado) return;   // llegó tarde: ya se escribió otra cosa (o se está guardando)
  filas = filas || [];
  if (!filas.length) {
    caja.innerHTML = `<p class="mr-chico">No encontramos “${escH(texto.trim())}”. Probá con otra palabra o con el CUIT.</p>`;
    return elegir(v, null);
  }
  // queda elegido solo el que coincide por CUIT: si no, recepción tiene que tocar uno (vincular no se deshace)
  const seguro = filas[0].coincide_cuit ? filas[0].codigo_erp : null;
  caja.innerHTML = `<div class="mr-opciones-vinculo" role="radiogroup" aria-labelledby="vPregunta">${filas.map(f => `<label><input type="radio" name="vinc" value="${escH(f.codigo_erp)}"${f.codigo_erp === seguro ? " checked" : ""}>`
    + `<span class="mr-resultado-razon" style="font-size:15px">${escH(f.razon_social)}</span>`
    + (f.coincide_cuit ? `<span class="mr-insignia mr-insignia--ok">Coincide el CUIT</span>` : "")
    + `<span class="mr-sub">Cód. <span class="mr-num">${escH(f.codigo_erp)}</span>${[f.localidad, f.zona, f.vendedor].filter(Boolean).map(x => " · " + escH(x)).join("")}</span></label>`).join("")}</div>`;
  elegir(v, seguro);
}

/* Mientras guarda, la hoja queda quieta: ni otra opción, ni otra búsqueda, ni otro botón. */
function hojaQuieta(v, quieta) {
  v.ocupado = quieta;
  v.dlg.querySelectorAll("input, button").forEach(x => { x.disabled = quieta; });
  if (!quieta) elegir(v, v.codigo);   // el botón de vincular vuelve con el código elegido (o apagado si no hay)
}

/* Vincular, "Es cliente nuevo" o "No es cliente": con señal (recepción está
   en la compu de la entrada). Si sale bien, se cierra y se actualiza. */
async function resolverAlta(v, fn, args, boton) {
  if (v.ocupado) return;
  const texto = boton.textContent;
  hojaQuieta(v, true);
  ocupar(boton, fn === "expo_vincular" ? "Vinculando…" : "Guardando…");
  v.en("error").innerHTML = "";
  try {
    await rpcRecepcion(fn, args);
  } catch (e) {
    if (!v.dlg.isConnected) return;   // la cerró salir()
    if (siEsDeSesion(e)) return;      // salir() cierra la hoja
    liberar(boton, texto);
    hojaQuieta(v, false);   // y el de vincular vuelve a decir el código elegido
    v.en("error").innerHTML = avisoFino({ tipo: "error", icono: ICONO.atencion, rol: "alert",
      texto: escH(e instanceof ErrorRed ? "No se pudo guardar. Revisá la conexión y probá de nuevo." : mensajeDe(e)) });
    if (e instanceof ErrorServidor && rec) cargarRecepcion();   // otra persona ya la resolvió: que se vea
    return;
  }
  v.ocupado = false;
  v.dlg.close();
  if (rec) cargarRecepcion();
}

/* ==========================================================================
   NAVEGACIÓN
   ========================================================================== */
/* Nunca se acepta un token de sesión pegado en la URL: se borra sin leerlo. */
const PROHIBIDOS = ["access_token", "refresh_token", "provider_token", "id_token"];

function leerRuta() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (PROHIBIDOS.some(k => p.has(k))) {
    history.replaceState(null, "", location.pathname + location.search);
    return {};
  }
  return Object.fromEntries(p);
}

function navegar() {
  const r = leerRuta();
  if ("cartel" in r) {
    claveDelLink(r.cartel, CLAVE_CARTEL, "#buscar");   // el QR del cartel
    return pantallaBuscar();
  }
  if ("t" in r) return abrirCliente(r.t);
  if ("buscar" in r) return pantallaBuscar();
  if ("alta" in r) return pantallaAlta();
  if ("equipo" in r) {
    claveDelLink(r.equipo, CLAVE_EQUIPO, "#recorrido");   // el link del equipo de recorrido
    return pantallaRecorrido();
  }
  if ("recorrido" in r) return pantallaRecorrido();
  if ("recepcion" in r) return abrirRecepcion();
  return claveCartel() ? pantallaBuscar() : claveEquipo() ? pantallaRecorrido() : pantallaInvalido();
}

window.addEventListener("hashchange", navegar);
// ¿vuelve de Google? (login de recepción: ?code=… o ?error=…)
const vuelta = new URLSearchParams(location.search);
if (vuelta.has("code") || vuelta.has("error")) volverDeGoogle(); else navegar();
procesarCola();

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => { /* sin SW la app anda igual con señal */ });
}
</script>
